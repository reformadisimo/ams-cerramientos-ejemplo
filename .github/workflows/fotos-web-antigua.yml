name: Fotos de la web antigua
on:
  push:
    branches: [fotos-web-antigua]
    paths: [".github/workflows/fotos-web-antigua.yml", "generator/fotos_web_antigua.mjs"]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock sharp
      - run: node generator/fotos_web_antigua.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add public/img/web-antigua
          git commit -m "Fotos de la web antigua optimizadas" || echo "sin cambios"
          git push
