<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tu folleto nuevo (boceto) | AMS Cerramientos</title>
<link rel="icon" href="/img/logo-cuadrado.png">
<style>
:root{--navy:#12202B;--or:#C2410C;--bg:#F3F6F9;--tx:#1F2A36;--mut:#5B6B79;--ln:#DDE4EA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
.top{background:var(--navy);color:#fff;padding:28px 16px 34px;text-align:center}
.top img{height:32px}
.top h1{margin:16px 0 6px;font-size:1.9rem;line-height:1.15}
.top p{margin:0 auto;max-width:560px;color:#B8C6D3;font-size:1.05rem}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 60px}
.caras{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.caras figure{margin:0}
.caras img{width:100%;height:auto;border-radius:10px;box-shadow:0 14px 34px rgba(18,32,43,.18);background:#fff}
.caras figcaption{text-align:center;color:var(--mut);margin-top:8px;font-weight:600}
.btn{display:inline-flex;align-items:center;min-height:48px;background:var(--or);color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:0 22px;margin-top:22px}
.centro{text-align:center}
@media (max-width:720px){.caras{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <img src="/img/logo-ams-blanco.svg" alt="AMS Cerramientos">
  <h1>Tu folleto nuevo (boceto)</h1>
  <p>Las dos caras del folleto de buzoneo, en tamaño A5. Es un primer boceto: dinos qué cambiarías.</p>
</div>
<div class="wrap">
  <div class="caras">
    <figure><img src="/guia-javi/folleto/cara1-ventanas.jpg" alt="Cara 1 del folleto: ventanas de PVC a medida"><figcaption>Cara 1: ventanas</figcaption></figure>
    <figure><img src="/guia-javi/folleto/cara2-cancelas.jpg" alt="Cara 2 del folleto: cancelas de aluminio soldado"><figcaption>Cara 2: cancelas</figcaption></figure>
  </div>
  <div class="centro"><a class="btn" href="/guia-javi/folleto/folleto-AMS-boceto.pdf" download>Descargar el PDF</a></div>
</div>
</body>
</html>
