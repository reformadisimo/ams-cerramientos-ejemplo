<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Contactos">
<link rel="manifest" href="manifest.webmanifest">
<title>Mis contactos | AMS Cerramientos</title>
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
:root{--navy:#12202B;--navy2:#1B3247;--or:#C2410C;--or2:#E8742A;--am:#FFF1E8;--bg:#F3F6F9;--tx:#1F2A36;--mut:#5B6B79;--ln:#DDE4EA;--ok:#15803D;--okb:#DCFCE7;--ko:#B91C1C;--kob:#FEE2E2;--wa:#1FA855;--gr:#EEF2F6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;font-size:17px;line-height:1.4}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:1.3em;height:1.3em;vertical-align:-.32em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:100px}
header{background:var(--navy);color:#fff;padding:14px 16px 18px;position:sticky;top:0;z-index:5}
header .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
header img{height:26px}
header .yo{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:22px;padding:8px 14px;font-size:.9rem;display:flex;align-items:center;gap:6px}
header h1{margin:12px 0 0;font-size:1.5rem;font-weight:700}
header p{margin:3px 0 0;color:#B8C6D3;font-size:.95rem}
.demo{background:#FFF7ED;color:#7C2D12;font-size:.84rem;padding:8px 16px;border-bottom:1px solid #FED7AA}
main{padding:16px}
h2{font-size:.84rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:24px 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--or);color:#fff;border-radius:12px;padding:1px 9px;font-size:.78rem}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;background:var(--or);color:#fff;font-weight:700;font-size:1.15rem;padding:18px;box-shadow:0 4px 16px rgba(194,65,12,.28);min-height:60px}
.big:active{transform:scale(.99)}
.big.gris{background:#fff;color:var(--navy);border:2px solid var(--ln);box-shadow:none}
.big.verde{background:var(--ok);box-shadow:0 4px 16px rgba(21,128,61,.25)}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px}
.card .top{display:flex;align-items:center;gap:12px;cursor:pointer}
.card .ic{width:46px;height:46px;border-radius:13px;background:var(--gr);display:flex;align-items:center;justify-content:center;color:var(--navy2);flex:none}
.card .ic svg{width:24px;height:24px}
.card .ic.web{background:var(--am);color:var(--or)}
.card .ic.si{background:var(--okb);color:var(--ok)}
.card .ic.no{background:var(--kob);color:var(--ko)}
.card .t{flex:1;min-width:0}
.card b{font-size:1.1rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:var(--mut);display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:.76rem;font-weight:700;border-radius:9px;padding:5px 9px;white-space:nowrap;background:var(--gr);color:var(--navy2);flex:none}
.st.nuevo{background:var(--am);color:var(--or)}.st.si{background:var(--okb);color:var(--ok)}.st.no{background:var(--kob);color:var(--ko)}
.acts{display:flex;gap:8px;margin-top:12px}
.acts a,.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;border-radius:12px;padding:12px;font-weight:700;color:#fff;background:var(--navy2);border:0;font-size:.98rem;min-height:48px}
.acts .wa{background:var(--wa)}
.preg{margin-top:12px;background:var(--am);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.preg span{flex:1;font-size:.95rem;min-width:120px}
.preg button{border:0;border-radius:10px;padding:9px 13px;font-weight:700;background:#fff;color:var(--navy)}
.preg button.si{background:var(--ok);color:#fff}
.vacio{color:var(--mut);background:#fff;border:1px dashed #C9D3DC;border-radius:16px;padding:18px;text-align:center;font-size:.95rem}
.vacio svg{width:34px;height:34px;display:block;margin:0 auto 6px;color:var(--or2)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav div{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:.8rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--or);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(18,32,43,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.pan{background:#fff;width:100%;max-width:560px;max-height:96vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.pan .cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.pan h3{margin:0;font-size:1.3rem}
.x{border:0;background:var(--gr);border-radius:50%;width:40px;height:40px;font-size:1.3rem;line-height:1;flex:none;display:flex;align-items:center;justify-content:center}
.x svg{width:20px;height:20px}
.sub{color:var(--mut);font-size:.92rem;margin:4px 0 0}
label.l{display:block;font-weight:700;font-size:.95rem;margin:18px 0 8px}
input.t,textarea.t{width:100%;border:2px solid #C9D3DC;border-radius:14px;padding:14px;font-size:1.05rem;background:#fff;min-height:54px}
input.t:focus,textarea.t:focus{outline:0;border-color:var(--or2)}
textarea.t{min-height:84px;resize:vertical}
.pista{color:var(--mut);font-size:.86rem;margin-top:7px;display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #C9D3DC;background:#fff;border-radius:24px;padding:10px 15px;font-size:.98rem;min-height:46px;display:flex;align-items:center;gap:6px}
.chip.on{border-color:var(--or);background:var(--am);color:var(--or);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2px solid #C9D3DC;background:#fff;border-radius:16px;padding:16px 10px;font-weight:600;font-size:.98rem;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:96px;text-align:center;line-height:1.2}
.tile svg{width:30px;height:30px;color:var(--navy2)}
.tile.on{border-color:var(--or);background:var(--am);color:var(--or)}
.tile.on svg{color:var(--or)}
.paso{display:flex;align-items:center;gap:12px;border:2px solid var(--ln);border-radius:14px;padding:12px 14px;background:#fff;text-align:left;width:100%;margin-bottom:8px;min-height:64px}
.paso .ic{width:40px;height:40px;border-radius:50%;background:var(--gr);display:flex;align-items:center;justify-content:center;flex:none}
.paso .ic svg{width:20px;height:20px}
.paso b{display:block;font-size:1.02rem}.paso small{color:var(--mut);font-size:.85rem;display:block}
.paso.hecho{border-color:var(--navy);background:var(--navy);color:#fff}.paso.hecho .ic{background:rgba(255,255,255,.18)}.paso.hecho small{color:#B8C6D3}
.paso.sig{border-color:var(--or2);background:var(--am)}
.paso .tag{margin-left:auto;font-size:.72rem;font-weight:700;background:var(--or);color:#fff;border-radius:8px;padding:4px 8px;flex:none}
.fin{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.fin button{border:2px solid;border-radius:16px;padding:14px 8px;font-weight:700;font-size:1.02rem;background:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:84px}
.fin button svg{width:26px;height:26px}
.fin .si{border-color:var(--ok);color:var(--ok)}.fin .si.on{background:var(--ok);color:#fff}
.fin .no{border-color:#C9D3DC;color:var(--mut)}.fin .no.on{background:var(--ko);border-color:var(--ko);color:#fff}
.caja{margin-top:14px;background:var(--gr);border-radius:14px;padding:12px 14px;font-size:.95rem}
.caja.ok{background:var(--okb);color:#14532D}
.caja.av{background:var(--am);color:#7C2D12}
.hist{margin-top:6px;border-left:3px solid var(--ln);padding-left:12px}
.hist div{font-size:.9rem;margin:8px 0}
.hist small{color:var(--mut);display:block;font-size:.78rem}
.puntos{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.puntos i{width:9px;height:9px;border-radius:50%;background:#C9D3DC;display:block}
.puntos i.on{background:var(--or);width:24px;border-radius:5px}
.volver{border:0;background:none;color:var(--mut);display:flex;align-items:center;gap:4px;padding:6px 0;font-size:.95rem}
.q{font-size:1.45rem;font-weight:700;margin:6px 0 4px;line-height:1.25}
.por{color:var(--mut);font-size:.92rem;margin:0 0 16px}
.mes{background:linear-gradient(135deg,#1B3247,#12202B);color:#fff;border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;margin-top:22px}
.mes .md{width:54px;height:54px;border-radius:50%;background:rgba(232,116,42,.18);display:flex;align-items:center;justify-content:center;flex:none;color:var(--or2)}
.mes .md svg{width:30px;height:30px}
.mes b{font-size:1.15rem;display:block}.mes span{color:#B8C6D3;font-size:.9rem;display:block}
.mes button{margin-top:6px;border:0;background:none;color:var(--or2);font-weight:700;padding:0;font-size:.9rem}
.frase{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px;font-size:1.08rem;line-height:1.5}
.frase b{color:var(--navy)}
.gente{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.gente svg{width:30px;height:30px;stroke-width:1.8}
.gente .si{color:var(--ok)}.gente .no{color:var(--ko)}.gente .en{color:#C9A227}
.ley{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.84rem;color:var(--mut)}
.ley i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.fila{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:8px}
.fila .ic{width:38px;height:38px;border-radius:11px;background:var(--gr);display:flex;align-items:center;justify-content:center;color:var(--navy2);flex:none}
.fila .ic.web{background:var(--am);color:var(--or)}
.fila .ic svg{width:20px;height:20px}
.fila .t{flex:1;min-width:0}
.fila b{display:block;font-size:.98rem}
.bar{height:8px;border-radius:4px;background:var(--gr);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--or2);border-radius:4px}
.fila .n{text-align:right;flex:none;font-size:.9rem;color:var(--mut)}
.fila .n b{font-size:1.15rem;color:var(--navy)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos div{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px}
.dos b{display:block;font-size:1.7rem;color:var(--navy)}
.dos span{font-size:.86rem;color:var(--mut);line-height:1.3;display:block}
.nota{font-size:.88rem;color:var(--mut);margin-top:14px;line-height:1.45}
.seg{display:flex;background:#E4EAF0;border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px 4px;font-size:.9rem;font-weight:600;color:var(--mut);min-height:44px}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.busca{position:relative;margin-bottom:12px}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mut)}
.busca input{padding-left:44px}
.peq{border:2px solid #C9D3DC;background:#fff;border-radius:12px;padding:10px 14px;font-size:.95rem;font-weight:600;min-height:46px}
.linea{display:flex;gap:8px;align-items:stretch}
.linea input{flex:1}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-20px);background:#fff;color:var(--navy);border:1px solid var(--ln);padding:14px 20px;border-radius:16px;font-weight:600;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:92%;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast svg{width:24px;height:24px;color:var(--ok)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
#tour{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px calc(28px + env(safe-area-inset-bottom));text-align:center}
#tour.on{display:flex}
#tour .il{width:120px;height:120px;border-radius:50%;background:rgba(232,116,42,.16);display:flex;align-items:center;justify-content:center;margin-bottom:26px}
#tour .il svg{width:62px;height:62px;color:var(--or2);stroke-width:1.7}
#tour h3{font-size:1.6rem;margin:0 0 12px;line-height:1.25}
#tour p{color:#B8C6D3;font-size:1.08rem;margin:0;max-width:420px;line-height:1.5}
#tour .puntos{margin:30px 0 18px}
#tour .puntos i{background:rgba(255,255,255,.25)}#tour .puntos i.on{background:var(--or2)}
#tour .big{max-width:420px}
#tour .chips{justify-content:center;margin-top:18px}
#tour .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}
#tour .chip.on{background:var(--or);border-color:var(--or)}
#tour .saltar{position:absolute;top:18px;right:18px;border:0;background:none;color:#B8C6D3;font-size:.95rem;padding:8px}
.okgrande{text-align:center;padding:30px 10px}
.okgrande .ci{width:92px;height:92px;border-radius:50%;background:var(--okb);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.okgrande .ci svg{width:48px;height:48px;stroke-width:3}
.okgrande h3{margin:0 0 6px;font-size:1.5rem}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<header>
 <div class="r"><img src="/img/logo-ams-blanco.svg" alt="AMS Cerramientos"><button class="yo" id="yo"></button></div>
 <h1 id="tit">Hoy</h1>
 <p id="sub"></p>
</header>
<div class="demo">Prueba con nombres inventados y dirección provisional. Toca lo que quieras: no se rompe nada. La de verdad será privada y con tu dominio.</div>
<main id="v"></main>
</div>
<nav><div>
 <button data-t="hoy" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoy</button>
 <button data-t="todos"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.3-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .6 3.2 2.5 3.5 5.5"/></svg>Contactos</button>

</div></nav>
<div class="sheet" id="sh"><div class="pan" id="pan"></div></div>
<div id="tour"></div>
<div id="toast"></div>
<canvas id="cf"></canvas>

function chips(id,ops,sel){return '<div class="chips" id="'+id+'">'+ops.map(o=>'<button type="button" class="chip'+(o===sel?' on':'')+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>'}
function chipsVivos(id,fn){document.querySelectorAll('#'+id+' .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#'+id+' .chip').forEach(o=>o.classList.remove('on'));c.classList.add('on');if(fn)fn(c.dataset.v)})}
$('yo').onclick=()=>{abre(cab('¿Quién eres?','Para apuntar quién hace cada cosa.')+'<div style="margin-top:14px">'+chips('qy',D.equipo,D.yo)+'</div><p class="pista">Si falta alguien, se añade en Ajustes.</p>');chipsVivos('qy',v=>{D.yo=v;guarda();cierra();vista()})};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;vista();scrollTo(0,0)});

// ---------- apuntar a alguien (paso a paso) ----------
function nuevo(){
 const N={nombre:'',ok:'',tk:'',tel:'',zona:''};let paso=0;
 function puntos(){return '<div class="puntos">'+[0,1,2,3].map(i=>'<i'+(i===paso?' class="on"':'')+'></i>').join('')+'</div>'}
 function pinta(){
  let h=cab(paso?'<button class="volver" id="atras">'+ic('atras')+'Atrás</button>':'Apuntar a alguien','');
  h+=puntos();
  if(paso===0)h+='<p class="q">¿Cómo se llama?</p><p class="por">Con el nombre de pila vale.</p><input class="t" id="w1" value="'+esc(N.nombre)+'" autocomplete="off" placeholder="Por ejemplo, Marta"><p class="pista">'+ic('mic')+'Puedes dictarlo con el micrófono del teclado.</p><button class="big" id="sig" style="margin-top:22px">Siguiente</button>';
  if(paso===1)h+='<p class="q">¿Cómo te ha llegado?</p><p class="por">Esto es lo que más nos ayuda. Toca uno.</p><div class="tiles">'+ORIG.map(o=>'<button class="tile'+(N.ok===o.k?' on':'')+'" data-o="'+o.k+'">'+ic(o.i)+esc(o.n)+'</button>').join('')+'</div>';
  if(paso===2)h+='<p class="q">¿Qué quiere?</p><p class="por">Más o menos. Se puede cambiar luego.</p><div class="tiles">'+TRAB.map(t=>'<button class="tile'+(N.tk===t.k?' on':'')+'" data-tk="'+t.k+'">'+ic(t.i)+esc(t.n)+'</button>').join('')+'</div>';
  if(paso===3)h+='<p class="q">Teléfono y pueblo</p><p class="por">Si no lo tienes a mano, déjalo vacío. Se puede poner después.</p><label class="l">Teléfono</label><input class="t" id="w4" inputmode="tel" value="'+esc(N.tel)+'" autocomplete="off"><label class="l">Pueblo</label><input class="t" id="w5" value="'+esc(N.zona)+'" autocomplete="off"><button class="big verde" id="fin" style="margin-top:24px">'+ic('check')+'Guardar</button>';
  abre(h);
  if($('atras'))$('atras').onclick=()=>{paso--;pinta()};
  if(paso===0){const i=$('w1');setTimeout(()=>i.focus(),50);const ok=()=>{N.nombre=i.value.trim();if(!N.nombre){i.focus();i.style.borderColor='var(--ko)';return}paso=1;pinta()};$('sig').onclick=ok;i.onkeydown=e=>{if(e.key==='Enter')ok()}}
  if(paso===1)document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{N.ok=b.dataset.o;vibra();paso=2;pinta()});
  if(paso===2)document.querySelectorAll('[data-tk]').forEach(b=>b.onclick=()=>{N.tk=b.dataset.tk;vibra();paso=3;pinta()});
  if(paso===3){$('w4').oninput=()=>N.tel=$('w4').value;$('w5').oninput=()=>N.zona=$('w5').value;$('fin').onclick=()=>{
   N.tel=$('w4').value.trim();N.zona=$('w5').value.trim();
   D.id++;const o=OR(N.ok);
   const x={id:D.id,nombre:N.nombre,tel:N.tel,ok:N.ok,origen:o.n,tk:N.tk,zona:N.zona,f:hoy(),est:'nuevo',quien:D.yo,h:[{f:hoy(),q:D.yo,x:'Apuntado ('+o.n.toLowerCase()+')'}]};
   D.L.unshift(x);guarda();vibra();
   abre('<div class="okgrande"><div class="ci">'+ic('check')+'</div><h3>¡Apuntado!</h3><p class="sub">'+esc(N.nombre)+' ya está en tu lista. Cuando le llames o vayas a verle, tócalo y marca cómo va.</p><button class="big" id="cx" style="margin-top:22px">Vale</button></div>');
   $('cx').onclick=()=>{cierra();tab='hoy';vista();scrollTo(0,0)};tab='hoy';vista();
  }}
 }
 pinta();
}

// ---------- ficha ----------
function ficha(id){
 const x=D.L.find(y=>y.id==id);if(!x)return;
 const o=OR(x.ok),t=TR(x.tk);
 const orden=['nuevo','hablado','visita','presupuesto'];
 function pinta(){
  const tl=String(x.tel||'').replace(/\D/g,'');
  const idx=orden.indexOf(x.est),cerrado=x.est==='si'||x.est==='no';
  let h=cab('¿Cómo va con '+esc(nombre(x))+'?',esc(t.n)+(x.zona?' · '+esc(x.zona):'')+' · entró '+cuando(x.f));
  h+='<div class="caja" style="margin-top:8px">'+ic(o.i)+' <b>'+esc(x.origen)+'</b>'+(x.pide?'<br>Pide: '+esc(x.pide):'')+'</div>';
  if(tl)h+='<div class="acts"><a href="tel:'+tl+'">'+ic('tel')+'Llamar</a><a class="wa" href="https://wa.me/34'+tl+'?text='+encodeURIComponent('Hola '+nombre(x)+', soy '+D.yo+' de AMS Cerramientos. ')+'" target="_blank" rel="noopener">'+WA+'WhatsApp</a></div>';
  else h+='<label class="l">Teléfono</label><div class="linea"><input class="t" id="ftel" inputmode="tel" placeholder="Si lo tienes"><button class="peq" id="ftelok">Guardar</button></div>';
  h+='<label class="l">Marca lo que ya has hecho</label>';
  PASOS.forEach((p,i)=>{const k=i+1;const hecho=cerrado||idx>=k,sig=!cerrado&&idx===k-1;
   h+='<button class="paso'+(hecho?' hecho':sig?' sig':'')+'" data-p="'+p.k+'"><div class="ic">'+ic(hecho?'check':p.i)+'</div><div><b>'+p.n+'</b><small>'+p.d+'</small></div>'+(sig?'<span class="tag">Siguiente</span>':'')+'</button>'});
  h+='<label class="l">¿Y al final?</label><div class="fin"><button class="si'+(x.est==='si'?' on':'')+'" data-fin="si">'+ic('check')+'¡Contratado!</button><button class="no'+(x.est==='no'?' on':'')+'" data-fin="no">'+ic('x')+'No ha salido</button></div>';
  if(x.est==='si')h+='<div class="caja ok"><label class="l" style="margin-top:0">¿Cuánto factura este trabajo? (€)</label><div class="linea"><input class="t" id="fimp" inputmode="numeric" value="'+(x.importe||'')+'"><button class="peq" id="fimpok">Guardar</button></div><p class="pista" id="fmed" style="color:#14532D"></p></div>';
  if(x.est==='no')h+='<div class="caja av"><label class="l" style="margin-top:0">¿Por qué no?</label>'+chips('fmot',MOT,x.motivo||'')+'</div>';
  if(D.equipo.length>1)h+='<label class="l">¿Quién lo lleva?</label>'+chips('fq',D.equipo,x.quien||'');
  h+='<label class="l">Apuntar algo</label><textarea class="t" id="fnt" placeholder="Ej.: chalet, 8 ventanas viejas, lo quieren antes de Navidad"></textarea><p class="pista">'+ic('mic')+'O díctalo con el micrófono del teclado.</p><button class="big gris" id="fntok" style="margin-top:10px">Guardar la nota</button>';
  h+='<h2>Lo que ha pasado</h2><div class="hist">'+x.h.slice().reverse().map(e=>'<div>'+esc(e.x)+'<small>'+fecha(e.f)+' · '+esc(e.q)+'</small></div>').join('')+'</div>';
  abre(h);
  const ev=(txt)=>x.h.push({f:hoy(),q:D.yo,x:txt});
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const k=b.dataset.p,i=orden.indexOf(k);if(x.est===k){x.est=orden[i-1];ev('Vuelve a «'+ETN[x.est]+'»')}else{x.est=k;ev(ETN[k])}delete x.ll;guarda();vibra();aviso('Guardado','check');pinta();vista()});
  document.querySelectorAll('[data-fin]').forEach(b=>b.onclick=()=>{const k=b.dataset.fin;
   if(x.est===k){x.est='presupuesto';ev('Vuelve a «Presupuesto dado»');guarda();pinta();vista();return}
   x.est=k;delete x.ll;ev(k==='si'?'Contratado':'No ha salido');guarda();vibra();
   if(k==='si'){fiesta();const n=mes().filter(y=>y.est==='si').length;aviso('¡Enhorabuena, '+D.yo+'! '+(n===1?'Primer trabajo del mes.':'Ya van '+n+' este mes.'),'medalla')}else aviso('Apuntado. Dinos por qué, si lo sabes.');
   pinta();vista();const f=$(k==='si'?'fimp':'fmot');if(f){f.scrollIntoView({block:'center',behavior:'smooth'});if(k==='si'&&!x.importe)setTimeout(()=>f.focus(),350)}});
  if($('fimp')){const m=()=>{const v=+$('fimp').value.replace(/\D/g,'');$('fmed').textContent=v&&D.media?'Está '+vsMedia(v)+'. Nosotros solo vemos ese porcentaje, no la cifra.':'La cifra solo la ves tú.'};$('fimp').oninput=m;m();$('fimpok').onclick=()=>{const v=+$('fimp').value.replace(/\D/g,'');if(!v)return;x.importe=v;ev('Factura: '+vsMedia(v));guarda();vibra();aviso('Guardado. Solo lo ves tú.','check');vista()}}
  if($('fmot'))chipsVivos('fmot',v=>{x.motivo=v;ev('Motivo: '+v.toLowerCase());guarda();vibra();aviso('Guardado','check');vista()});
  if($('fq'))chipsVivos('fq',v=>{x.quien=v;guarda();vibra();aviso('Lo lleva '+v,'check')});
  if($('ftelok'))$('ftelok').onclick=()=>{const v=$('ftel').value.trim();if(!v)return;x.tel=v;guarda();pinta();vista()};
  $('fntok').onclick=()=>{const v=$('fnt').value.trim();if(!v)return;ev(v);guarda();vibra();aviso('Nota guardada','check');pinta()};
 }
 pinta();
}

// ---------- explicación inicial ----------
function tour(i){
 const S=[
  {i:'lapiz',t:'Apunta a cada persona que te pide presupuesto',p:'Nombre y de dónde viene. Diez segundos. Los que entran por la web se apuntan solos.'},
  {i:'check',t:'Después de cada visita, marca cómo va',p:'Un toque: visita hecha, presupuesto dado, contratado. Sin escribir nada.'},
  {i:'graf',t:'El móvil hace los números por ti',p:'Y nosotros sabemos qué anuncios te traen trabajo. Tu facturación no la vemos: solo porcentajes.'},
  {i:'persona',t:'¿Quién va a usar este móvil?',p:'Para que quede apuntado quién hace cada cosa.'}
 ];
 const s=S[i],T=$('tour');
 T.innerHTML='<button class="saltar" id="saltar">Saltar</button><div class="il">'+ic(s.i)+'</div><h3>'+s.t+'</h3><p>'+s.p+'</p>'+(i===3?'<div class="chips">'+D.equipo.map(p=>'<button class="chip'+(p===D.yo?' on':'')+'" data-v="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div>':'')+'<div class="puntos">'+S.map((_,k)=>'<i'+(k===i?' class="on"':'')+'></i>').join('')+'</div><button class="big" id="tsig">'+(i===3?'Empezar':'Siguiente')+'</button>';
 T.classList.add('on');
 const fin=()=>{D.tour=1;guarda();T.classList.remove('on');vista()};
 $('saltar').onclick=fin;
 $('tsig').onclick=()=>{if(i<3)tour(i+1);else fin()};
 T.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{T.querySelectorAll('.chip').forEach(o=>o.classList.remove('on'));c.classList.add('on');D.yo=c.dataset.v;guarda()});
}
vista();
if(!D.tour)tour(0);
})();
</script>
</body>
</html>
